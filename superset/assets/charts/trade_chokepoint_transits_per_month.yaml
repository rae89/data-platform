slice_name: 'Chokepoint transits per month: Panama Canal and Red Sea routes'
description: null
certified_by: null
certification_details: null
viz_type: echarts_timeseries_line
params:
  datasource: 3__table
  viz_type: echarts_timeseries_line
  time_range: No filter
  adhoc_filters:
  - expressionType: SQL
    sqlExpression: is_complete_month
    clause: WHERE
  - expressionType: SIMPLE
    subject: chokepoint_name
    operator: IN
    comparator:
    - Panama Canal
    - Suez Canal
    - Bab el-Mandeb Strait
    - Cape of Good Hope
    clause: WHERE
  - expressionType: SIMPLE
    subject: month
    operator: TEMPORAL_RANGE
    comparator: No filter
    clause: WHERE
  x_axis: month
  time_grain_sqla: P1M
  metrics:
  - expressionType: SIMPLE
    column:
      column_name: transits_total
    aggregate: SUM
    label: Transits
  groupby:
  - chokepoint_name
  row_limit: 10000
  show_legend: true
  rich_tooltip: true
  y_axis_format: ',.0f'
