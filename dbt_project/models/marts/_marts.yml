version: 2

models:
  - name: customer_orders
    description: One row per customer with lifetime order stats.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
  - name: daily_revenue
    description: Revenue per day, excluding returned orders.
    columns:
      - name: order_date
        data_tests: [unique, not_null]
  - name: port_daily_activity
    config:
      meta: {dagster: {group: sources}}  # built only on daily dlt sources
    description: Daily container activity per port with 7-day averages (IMF PortWatch, estimated).
    columns:
      - name: activity_date
        data_tests: [not_null]
      - name: port_id
        data_tests: [not_null]
      - name: port_name
        data_tests: [not_null]
