name: data_platform
version: "1.0.0"
profile: data_platform

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  data_platform:
    staging:
      +materialized: view
      +schema: staging
      # Models on dlt sources load daily with them (job ingest_sources), group `sources`.
      portwatch:
        +meta: {dagster: {group: sources}}
    marts:
      +materialized: table
      +schema: marts
