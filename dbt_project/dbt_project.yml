name: data_platform
version: "1.0.0"
profile: data_platform

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  data_platform:
    # Dagster asset groups by layer: dlt loads are `source`, staging is `transform`,
    # marts are `metrics` (read in src/data_platform/defs/dbt/defs.yaml).
    staging:
      +materialized: view
      +schema: staging
      +meta: {dagster: {group: transform}}
    marts:
      +materialized: table
      +schema: marts
      +meta: {dagster: {group: metrics}}
