[project]
name = "data_platform"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.29",
    "dagster-dbt>=0.29.29",
    "dagster-dlt==0.29.29",
    "dagster-duckdb>=0.29.29",
    "dagster-victoria-sli>=0.1.0",
    "dbt-duckdb>=1.11.1",
    "dlt==1.32.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "data_platform"
registry_modules = [
    "data_platform.components.*",
]



# Shared observability package, kept in this repo as a uv workspace member so other
# code locations can install it (e.g. from git) until it's published to an index.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
dagster-victoria-sli = { workspace = true }

[tool.coverage.run]
source = ["dagster_victoria_sli", "data_platform"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 99
skip_covered = true
