type: dagster_dbt.DbtProjectComponent

attributes:
  project: '{{ context.project_root }}/dbt_project'
  cli_args:
    - build
  # Records row counts on each model (dagster/row_count), picked up by the SLI sensor.
  include_metadata:
    - row_count
  translation:
    # `transform`, unless the model sets meta.dagster.group (e.g. `sources` for models
    # built only on daily dlt sources; see dbt_project.yml).
    group_name: "{{ node.get('meta', {}).get('dagster', {}).get('group', 'transform') }}"
